<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
<head>
  <title>{{ site.title }}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="description" content="{{ site.description }}">
  {% if site.keywords %}<meta name="keywords" content="{{ site.keywords }}">{% endif %}
  {% if site.canonical %}<link rel="canonical" href="{{ site.canonical }}">{% endif %}
  <meta property="og:type" content="profile">
  <meta property="og:title" content="{{ site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:url" content="{{ site.canonical }}">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{{ site.title }}">
  <meta name="twitter:description" content="{{ site.description }}">
  <link rel="icon" href="{{ site.favicon | relative_url }}" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ "/assets/css/style-no-dark-mode.css" | relative_url }}">
</head>
<body>
  <main>
    <div class="botanical" aria-hidden="true">❦</div>

    <nav class="toc" aria-label="Sections">
      <a href="#dispatches">Dispatches</a><span class="sep">·</span>
      <a href="#works">Publications</a><span class="sep">·</span>
      <a href="#service">Service</a>
    </nav>

    <header class="masthead">
      <h1>{{ site.title }}</h1>
      <div class="ornament" aria-hidden="true">✦</div>
    </header>

    {{ content }}

    <footer>
      <p class="place">Tianjin, China</p>
    </footer>
  </main>

  <script>
    (function () {
      var links = document.querySelectorAll('nav.toc a[href^="#"]');
      var map = new Map();
      links.forEach(function (link) {
        var section = document.getElementById(link.getAttribute('href').slice(1));
        if (section) map.set(section, link);
      });
      if (!('IntersectionObserver' in window) || map.size === 0) return;
      var current = null;
      var observer = new IntersectionObserver(function (entries) {
        entries.forEach(function (entry) {
          if (!entry.isIntersecting) return;
          if (current) current.classList.remove('active');
          current = map.get(entry.target);
          if (current) current.classList.add('active');
        });
      }, { rootMargin: '-30% 0px -60% 0px' });
      map.forEach(function (_, section) { observer.observe(section); });
    })();
  </script>
  {% if site.google_analytics %}
  <script>
    (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
    (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
    m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
    })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
    ga('create', '{{ site.google_analytics }}', 'auto');
    ga('send', 'pageview');
  </script>
  {% endif %}
</body>
</html>
